<!DOCTYPE html>

<html lang="th">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0"
>

<title>
ระบบตรวจสอบการเข้าโรงเรียน
</title>


<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>


<style>

* {
  box-sizing: border-box;
}


body {

  margin: 0;

  font-family:
    Arial,
    "Noto Sans Thai",
    sans-serif;

  background: #f1f5f9;

  color: #1e293b;

}


header {

  background:
    linear-gradient(
      135deg,
      #2563eb,
      #4f46e5
    );

  color: white;

  padding: 22px;

  text-align: center;

}


header h1 {

  margin: 0;

  font-size: 26px;

}


header p {

  margin: 7px 0 0;

  opacity: .9;

}


.container {

  max-width: 1100px;

  margin: auto;

  padding: 20px;

}


.menu {

  display: grid;

  grid-template-columns:
    repeat(4, 1fr);

  gap: 12px;

  margin-bottom: 20px;

}


.menu button {

  border: none;

  padding: 15px;

  border-radius: 12px;

  background: white;

  cursor: pointer;

  font-size: 15px;

  box-shadow:
    0 2px 8px rgba(0,0,0,.08);

}


.menu button:hover {

  background: #eff6ff;

}


.page {

  display: none;

}


.page.active {

  display: block;

}


.card {

  background: white;

  border-radius: 18px;

  padding: 20px;

  margin-bottom: 20px;

  box-shadow:
    0 3px 12px rgba(0,0,0,.08);

}


.stats {

  display: grid;

  grid-template-columns:
    repeat(3, 1fr);

  gap: 15px;

}


.stat {

  padding: 20px;

  border-radius: 15px;

  background: #eff6ff;

}


.stat h3 {

  margin: 0;

  font-size: 15px;

}


.stat strong {

  display: block;

  margin-top: 8px;

  font-size: 30px;

}


input {

  width: 100%;

  padding: 13px;

  border: 1px solid #cbd5e1;

  border-radius: 10px;

  margin: 7px 0 14px;

  font-size: 16px;

}


button.primary {

  width: 100%;

  border: none;

  padding: 14px;

  border-radius: 10px;

  background: #2563eb;

  color: white;

  font-size: 16px;

  cursor: pointer;

}


button.success {

  background: #16a34a;

}


button.danger {

  background: #dc2626;

}


video {

  width: 100%;

  max-width: 640px;

  border-radius: 15px;

  background: #000;

  display: block;

  margin: 15px auto;

}


.camera-box {

  text-align: center;

}


.status {

  text-align: center;

  padding: 15px;

  border-radius: 10px;

  background: #f8fafc;

  margin-top: 10px;

}


table {

  width: 100%;

  border-collapse: collapse;

}


th,
td {

  padding: 10px;

  border-bottom:
    1px solid #e2e8f0;

  text-align: left;

}


@media(max-width:700px) {

  .menu {

    grid-template-columns:
      repeat(2, 1fr);

  }


  .stats {

    grid-template-columns: 1fr;

  }


  header h1 {

    font-size: 21px;

  }

}

</style>

</head>


<body>


<header>

<h1>
🏫 ระบบตรวจสอบการเข้าโรงเรียน
</h1>

<p>
ระบบรู้จำใบหน้า
</p>

</header>


<div class="container">


<div class="menu">

<button onclick="showPage('home')">
🏠 หน้าแรก
</button>

<button onclick="showPage('register')">
👨‍🎓 ลงทะเบียน
</button>

<button onclick="showPage('scan')">
📷 สแกนใบหน้า
</button>

<button onclick="showPage('report')">
📊 รายงาน
</button>

</div>


<!-- HOME -->

<section
  id="home"
  class="page active"
>

<div class="card">

<h2>
ภาพรวมระบบ
</h2>


<div class="stats">

<div class="stat">

<h3>
นักเรียนทั้งหมด
</h3>

<strong id="totalStudents">
0
</strong>

</div>


<div class="stat">

<h3>
เช็กชื่อวันนี้
</h3>

<strong id="todayAttendance">
0
</strong>

</div>


<div class="stat">

<h3>
การเช็กชื่อทั้งหมด
</h3>

<strong id="totalAttendance">
0
</strong>

</div>

</div>

</div>

</section>


<!-- REGISTER -->

<section
  id="register"
  class="page"
>

<div class="card">

<h2>
👨‍🎓 ลงทะเบียนนักเรียน
</h2>


<input
  id="studentId"
  placeholder="รหัสนักเรียน"
/>


<input
  id="studentName"
  placeholder="ชื่อนักเรียน"
/>


<input
  id="studentClass"
  placeholder="ห้องเรียน เช่น ม.1/1"
/>


<div class="camera-box">

<video
  id="registerVideo"
  autoplay
  muted
  playsinline
></video>


<button
  class="primary"
  onclick="startRegisterCamera()"
>

เปิดกล้อง

</button>


<br><br>


<button
  class="primary success"
  onclick="registerFace()"
>

บันทึกใบหน้า

</button>


<div
  id="registerStatus"
  class="status"
>

ยังไม่ได้เปิดกล้อง

</div>

</div>

</div>

</section>


<!-- SCAN -->

<section
  id="scan"
  class="page"
>

<div class="card">

<h2>
📷 สแกนใบหน้า
</h2>


<div class="camera-box">

<video
  id="scanVideo"
  autoplay
  muted
  playsinline
></video>


<button
  class="primary"
  onclick="startScan()"
>

เริ่มสแกน

</button>


<br><br>


<button
  class="primary danger"
  onclick="stopScan()"
>

หยุดกล้อง

</button>


<div
  id="scanStatus"
  class="status"
>

กดเริ่มสแกนเพื่อเปิดกล้อง

</div>

</div>

</div>

</section>


<!-- REPORT -->

<section
  id="report"
  class="page"
>

<div class="card">

<h2>
📊 รายงานการเข้าโรงเรียน
</h2>


<button
  class="primary"
  onclick="loadReport()"
>

โหลดข้อมูล

</button>


<br><br>


<div style="overflow-x:auto;">

<table>

<thead>

<tr>

<th>รหัส</th>

<th>ชื่อ</th>

<th>ห้อง</th>

<th>เวลา</th>

<th>สถานะ</th>

</tr>

</thead>

<tbody
  id="reportBody"
>

</tbody>

</table>

</div>

</div>

</section>


</div>


<script>


/* =========================
   CONFIG
========================= */

const GAS_URL =
'https://script.google.com/macros/s/AKfycbyqikxsEvqAQaTKx36Y4BAzv84oW06ZwT-Ppvwt3zj7tFnN_FP9VQNpH6f7ofgFnjrhdw/exec';


const MODEL_URL =
'https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model';


let students = [];

let registerStream = null;

let scanStream = null;

let scanRunning = false;

let modelsLoaded = false;


/* =========================
   API
========================= */

async function api(action, data = {}) {

  const body = {

    action: action,

    ...data

  };


  const response =
    await fetch(
      GAS_URL,
      {

        method: 'POST',

        headers: {

          'Content-Type':
            'text/plain;charset=utf-8'

        },

        body: JSON.stringify(body)

      }
    );


  return await response.json();

}


/* =========================
   PAGE
========================= */

function showPage(page) {

  document
    .querySelectorAll('.page')
    .forEach(p => {

      p.classList.remove('active');

    });


  document
    .getElementById(page)
    .classList.add('active');


  if (page === 'home') {

    loadDashboard();

  }


  if (page === 'report') {

    loadReport();

  }

}


/* =========================
   LOAD MODELS
========================= */

async function loadModels() {

  if (modelsLoaded) return;


  document.getElementById(
    'registerStatus'
  ).textContent =
    'กำลังโหลด AI...';


  await faceapi.nets.tinyFaceDetector.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceLandmark68Net.loadFromUri(
    MODEL_URL
  );


  await faceapi.nets.faceRecognitionNet.loadFromUri(
    MODEL_URL
  );


  modelsLoaded = true;


  document.getElementById(
    'registerStatus'
  ).textContent =
    'AI พร้อมใช้งาน';

}


/* =========================
   START REGISTER CAMERA
========================= */

async function startRegisterCamera() {

  try {

    await loadModels();


    if (registerStream) {

      registerStream
        .getTracks()
        .forEach(t => t.stop());

    }


    registerStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: 'user',

          width: {

            ideal: 640

          },

          height: {

            ideal: 480

          }

        },

        audio: false

      });


    const video =
      document.getElementById(
        'registerVideo'
      );


    video.srcObject =
      registerStream;


    document.getElementById(
      'registerStatus'
    ).textContent =
      'เปิดกล้องแล้ว กรุณามองกล้อง';

  } catch (error) {

    console.error(error);


    document.getElementById(
      'registerStatus'
    ).textContent =
      'ไม่สามารถเปิดกล้องได้: ' +
      error.message;

  }

}


/* =========================
   REGISTER FACE
========================= */

async function registerFace() {

  try {

    const id =
      document
        .getElementById('studentId')
        .value.trim();


    const name =
      document
        .getElementById('studentName')
        .value.trim();


    const className =
      document
        .getElementById('studentClass')
        .value.trim();


    if (!id || !name || !className) {

      alert(
        'กรุณากรอกข้อมูลนักเรียนให้ครบ'
      );

      return;

    }


    const video =
      document.getElementById(
        'registerVideo'
      );


    if (!video.srcObject) {

      alert(
        'กรุณาเปิดกล้องก่อน'
      );

      return;

    }


    document.getElementById(
      'registerStatus'
    ).textContent =
      'กำลังบันทึกใบหน้า...';


    const descriptors = [];


    /*
      เก็บใบหน้า 5 ตัวอย่าง
      เพื่อช่วยให้รู้จำได้แม่นขึ้น
    */

    for (let i = 0; i < 5; i++) {

      const detection =
        await faceapi
          .detectSingleFace(
            video,
            new faceapi.TinyFaceDetectorOptions({
              inputSize: 320,
              scoreThreshold: 0.5
            })
          )
          .withFaceLandmarks()
          .withFaceDescriptor();


      if (!detection) {

        alert(
          'ไม่พบใบหน้า กรุณามองกล้อง'
        );

        return;

      }


      descriptors.push(
        Array.from(
          detection.descriptor
        )
      );


      document.getElementById(
        'registerStatus'
      ).textContent =
        `กำลังบันทึก ${i + 1}/5`;


      await sleep(500);

    }


    const result =
      await api(
        'addStudent',
        {

          studentId: id,

          name: name,

          className: className,

          descriptors: descriptors

        }
      );


    if (!result.success) {

      throw new Error(
        result.message
      );

    }


    alert(
      'ลงทะเบียนนักเรียนสำเร็จ'
    );


    document.getElementById(
      'studentId'
    ).value = '';


    document.getElementById(
      'studentName'
    ).value = '';


    document.getElementById(
      'studentClass'
    ).value = '';


    document.getElementById(
      'registerStatus'
    ).textContent =
      'ลงทะเบียนเรียบร้อย';


    await loadStudents();

  } catch (error) {

    console.error(error);

    alert(
      'เกิดข้อผิดพลาด: ' +
      error.message
    );

  }

}


/* =========================
   LOAD STUDENTS
========================= */

async function loadStudents() {

  const result =
    await api(
      'getStudents'
    );


  if (result.success) {

    students =
      result.students || [];

  }

}


/* =========================
   START SCAN
========================= */

async function startScan() {

  try {

    await loadModels();

    await loadStudents();


    if (students.length === 0) {

      alert(
        'ยังไม่มีข้อมูลนักเรียน'
      );

      return;

    }


    if (scanStream) {

      scanStream
        .getTracks()
        .forEach(t => t.stop());

    }


    scanStream =
      await navigator.mediaDevices.getUserMedia({

        video: {

          facingMode: 'user',

          width: {

            ideal: 640

          },

          height: {

            ideal: 480

          }

        },

        audio: false

      });


    const video =
      document.getElementById(
        'scanVideo'
      );


    video.srcObject =
      scanStream;


    scanRunning = true;


    document.getElementById(
      'scanStatus'
    ).textContent =
      'กำลังสแกนใบหน้า...';


    scanLoop();

  } catch (error) {

    console.error(error);


    document.getElementById(
      'scanStatus'
    ).textContent =
      'เปิดกล้องไม่ได้: ' +
      error.message;

  }

}


/* =========================
   SCAN LOOP
========================= */

async function scanLoop() {

  if (!scanRunning) return;


  const video =
    document.getElementById(
      'scanVideo'
    );


  const detections =
    await faceapi
      .detectAllFaces(
        video,
        new faceapi.TinyFaceDetectorOptions({
          inputSize: 320,
          scoreThreshold: 0.5
        })
      )
      .withFaceLandmarks()
      .withFaceDescriptors();


  if (detections.length > 0) {

    for (const detection of detections) {

      const match =
        findBestStudent(
          detection.descriptor
        );


      if (
        match &&
        match.distance < 0.50
      ) {

        await checkAttendance(
          match.student
        );

      }

    }

  }


  setTimeout(
    scanLoop,
    1500
  );

}


/* =========================
   FIND BEST STUDENT
========================= */

function findBestStudent(
  descriptor
) {

  let bestStudent = null;

  let bestDistance = Infinity;


  for (const student of students) {

    if (
      !student.descriptors ||
      student.descriptors.length === 0
    ) {
      continue;
    }


    for (
      const savedDescriptor
      of student.descriptors
    ) {

      const distance =
        faceapi.euclideanDistance(
          descriptor,
          savedDescriptor
        );


      if (
        distance <
        bestDistance
      ) {

        bestDistance =
          distance;

        bestStudent =
          student;

      }

    }

  }


  if (!bestStudent) {

    return null;

  }


  return {

    student:
      bestStudent,

    distance:
      bestDistance

  };

}


/* =========================
   CHECK ATTENDANCE
========================= */

async function checkAttendance(
  student
) {

  document.getElementById(
    'scanStatus'
  ).textContent =
    `พบ ${student.name} กำลังบันทึก...`;


  const result =
    await api(
      'recordAttendance',
      {

        studentId:
          student.studentId,

        name:
          student.name,

        className:
          student.className

      }
    );


  if (
    result.alreadyChecked
  ) {

    document.getElementById(
      'scanStatus'
    ).textContent =
      `${student.name} เช็กชื่อวันนี้แล้ว`;

    return;

  }


  if (result.success) {

    document.getElementById(
      'scanStatus'
    ).textContent =
      `✅ ${student.name} เช็กชื่อสำเร็จ ${result.timestamp}`;

  }

}


/* =========================
   STOP SCAN
========================= */

function stopScan() {

  scanRunning = false;


  if (scanStream) {

    scanStream
      .getTracks()
      .forEach(t => t.stop());

    scanStream = null;

  }


  const video =
    document.getElementById(
      'scanVideo'
    );


  video.srcObject = null;


  document.getElementById(
    'scanStatus'
  ).textContent =
    'หยุดกล้องแล้ว';

}


/* =========================
   DASHBOARD
========================= */

async function loadDashboard() {

  try {

    const result =
      await api(
        'getStats'
      );


    if (!result.success) return;


    document.getElementById(
      'totalStudents'
    ).textContent =
      result.totalStudents;


    document.getElementById(
      'todayAttendance'
    ).textContent =
      result.todayAttendance;


    document.getElementById(
      'totalAttendance'
    ).textContent =
      result.totalAttendance;

  } catch (error) {

    console.error(error);

  }

}


/* =========================
   REPORT
========================= */

async function loadReport() {

  const result =
    await api(
      'getAttendance'
    );


  if (!result.success) {

    return;

  }


  const body =
    document.getElementById(
      'reportBody'
    );


  body.innerHTML = '';


  result.attendance.forEach(
    row => {

      const tr =
        document.createElement(
          'tr'
        );


      tr.innerHTML = `

        <td>${escapeHtml(
          row.studentId
        )}</td>

        <td>${escapeHtml(
          row.name
        )}</td>

        <td>${escapeHtml(
          row.className
        )}</td>

        <td>${escapeHtml(
          row.timestamp
        )}</td>

        <td>${escapeHtml(
          row.status
        )}</td>

      `;


      body.appendChild(tr);

    }
  );

}


/* =========================
   ESCAPE HTML
========================= */

function escapeHtml(
  text
) {

  return String(text || '')
    .replace(
      /&/g,
      '&amp;'
    )
    .replace(
      /</g,
      '&lt;'
    )
    .replace(
      />/g,
      '&gt;'
    )
    .replace(
      /"/g,
      '&quot;'
    )
    .replace(
      /'/g,
      '&#039;'
    );

}


/* =========================
   SLEEP
========================= */

function sleep(ms) {

  return new Promise(
    resolve =>
      setTimeout(
        resolve,
        ms
      )
  );

}


/* =========================
   START
========================= */

window.addEventListener(
  'load',
  async () => {

    try {

      await api(
        'initialize'
      );

      await loadStudents();

      await loadDashboard();

    } catch (error) {

      console.error(error);

    }

  }
);

</script>


</body>

</html>
